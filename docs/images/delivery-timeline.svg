  .sub, .label, .tick { fill: #52514e; font-size: 12px; }
  .label { font-size: 13px; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #b9b8b2; stroke-width: 1; }
  .line { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-linejoin: round; }
  .dot { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
  .miss { fill: none; stroke: #52514e; stroke-width: 2; }
  .note { fill: #0b0b0b; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .title, .note { fill: #ffffff; }
    .sub, .label, .tick { fill: #c3c2b7; }
    .grid { stroke: #33332f; }
    .axis { stroke: #5c5b55; }
    .line { stroke: #3987e5; }
    .dot { fill: #3987e5; stroke: #1a1a19; }
    .miss { stroke: #c3c2b7; }
  }
</style>
