; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4

; Wokwi has no simulated BME280 part, so this env swaps in a BMP180
; (temperature + pressure only, no humidity) for use in the simulator.
; Build with "pio run -e esp32dev-sim" before starting the Wokwi simulator.
[env:esp32dev-sim]
extends = env:esp32dev
build_flags = -DWOKWI_SIMULATION
lib_deps =
    ${env:esp32dev.lib_deps}
    adafruit/Adafruit BMP085 Library@^1.2.4
